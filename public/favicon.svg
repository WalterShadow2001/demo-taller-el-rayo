<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Taller El Rayo">
  <title>Taller El Rayo</title>
  <defs>
    <linearGradient id="fav-bolt" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="55%" stop-color="#FF9E1A"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
    <linearGradient id="fav-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon -->
  <path d="M 16 2 L 28 9 L 28 23 L 16 30 L 4 23 L 4 9 Z"
        fill="url(#fav-frame)" stroke="#FF6B1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Lightning bolt -->
  <path d="M 19 6 L 11 17 L 15 17 L 13 25 L 21 13 L 17 13 Z"
        fill="url(#fav-bolt)" stroke="#1F1F1F" stroke-width="0.8" stroke-linejoin="round"/>
