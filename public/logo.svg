<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Taller El Rayo">
  <title>Taller El Rayo</title>
  <desc>Emblema industrial hexagonal con rayo, llaves cruzadas y monograma ER.</desc>
  <defs>
    <linearGradient id="er-bolt" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="55%" stop-color="#FF9E1A"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
    <linearGradient id="er-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="er-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A3A"/>
      <stop offset="100%" stop-color="#E0560F"/>
    </linearGradient>
    <radialGradient id="er-rivet" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8A8A8A"/>
      <stop offset="60%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </radialGradient>
    <radialGradient id="er-disc" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
  </defs>

  <!-- Outer hexagon frame (pointy-top) -->
  <path d="M 100 8 L 176 52 L 176 148 L 100 192 L 24 148 L 24 52 Z"
        fill="url(#er-frame)" stroke="url(#er-ring)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner hex accent line -->
  <path d="M 100 18 L 167 57 L 167 143 L 100 182 L 33 143 L 33 57 Z"
        fill="none" stroke="#FF6B1A" stroke-width="1.2" opacity="0.45"/>

  <!-- Crossed wrenches (steel, behind bolt) -->
  <g opacity="0.62">
    <!-- diagonal 1: top-left to bottom-right -->
    <g transform="rotate(45 100 100)">
      <rect x="50" y="97" width="74" height="7" rx="1.5" fill="#5A5A5A"/>
      <circle cx="50" cy="100.5" r="8" fill="#5A5A5A"/>
      <circle cx="50" cy="100.5" r="3.2" fill="#1F1F1F"/>
      <circle cx="128" cy="100.5" r="9.5" fill="#5A5A5A"/>
      <polygon points="128,93.5 134.5,97.2 134.5,103.8 128,107.5 121.5,103.8 121.5,97.2" fill="#1F1F1F"/>
    </g>
    <!-- diagonal 2: top-right to bottom-left -->
    <g transform="rotate(-45 100 100)">
      <rect x="50" y="97" width="74" height="7" rx="1.5" fill="#5A5A5A"/>
      <circle cx="50" cy="100.5" r="8" fill="#5A5A5A"/>
      <circle cx="50" cy="100.5" r="3.2" fill="#1F1F1F"/>
      <circle cx="128" cy="100.5" r="9.5" fill="#5A5A5A"/>
      <polygon points="128,93.5 134.5,97.2 134.5,103.8 128,107.5 121.5,103.8 121.5,97.2" fill="#1F1F1F"/>
    </g>
  </g>

  <!-- Lightning bolt (dominant, gradient, centered) -->
  <path d="M 118 32 L 72 108 L 98 108 L 82 150 L 134 78 L 108 78 Z"
        fill="url(#er-bolt)" stroke="#1F1F1F" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Spark accent at bolt tip -->
  <circle cx="120" cy="29" r="2.6" fill="#FFD23F"/>

  <!-- "ER" monogram plate at bottom -->
  <g>
    <rect x="76" y="160" width="48" height="20" rx="3" fill="#FF6B1A" stroke="#1F1F1F" stroke-width="1.4"/>
    <text x="100" y="175" text-anchor="middle"
          font-family="Arial Black, Helvetica, sans-serif"
          font-weight="900" font-size="14" fill="#1F1F1F" letter-spacing="1.5">ER</text>
  </g>

  <!-- Rivets at hex vertices -->
  <g fill="url(#er-rivet)">
    <circle cx="100" cy="8" r="3.4"/>
    <circle cx="176" cy="52" r="3.4"/>
    <circle cx="176" cy="148" r="3.4"/>
    <circle cx="100" cy="192" r="3.4"/>
    <circle cx="24" cy="148" r="3.4"/>
    <circle cx="24" cy="52" r="3.4"/>
  </g>
</svg>
